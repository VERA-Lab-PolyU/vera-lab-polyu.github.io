{{ $person := . }}
{{ $destination := $person.profile | default (relURL "people/") }}
<article class="home-person" data-reveal>
  <a href="{{ $destination }}"{{ with $person.profile }} target="_blank" rel="noreferrer"{{ end }} aria-label="View {{ $person.name }}'s profile">
    <div class="home-person-photo">{{ partial "avatar.html" $person }}</div>
    <p class="person-role">{{ $person.role }}</p>
    <h3>{{ $person.name }}</h3>
    <p class="member-affiliation">{{ $person.affiliation_short | default $person.affiliation }}</p>
    {{ with $person.note }}<p class="member-note">{{ . }}</p>{{ end }}
  </a>
</article>
